# Apache virtual host for seattlefallbeers.com.
# Install: sudo cp seattlefallbeers.com.conf /etc/apache2/sites-available/
#          sudo a2enmod headers && sudo a2ensite seattlefallbeers.com
# certbot --apache later adds the HTTPS (:443) host and the HTTP redirect.
<VirtualHost *:80>
    ServerName seattlefallbeers.com
    ServerAlias www.seattlefallbeers.com
    DocumentRoot /var/www/seattlefallbeers.com

    <Directory /var/www/seattlefallbeers.com>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Hide dotfiles, including the scraper's short-lived .atg-staging-*
    # directories, but keep certbot's /.well-known/ reachable.
    <LocationMatch "^/\.(?!well-known/)">
        Require all denied
    </LocationMatch>

    AddType text/calendar .ics
    AddType application/json .json

    <IfModule mod_headers.c>
        # data.json and events.ics change hourly; keep caches short.
        <FilesMatch "\.(json|ics)$">
            Header set Cache-Control "public, max-age=300"
        </FilesMatch>
        # Pages and their shared script/styles change only on code updates.
        <FilesMatch "\.(html|js|css)$">
            Header set Cache-Control "public, max-age=3600"
        </FilesMatch>
        Header always set X-Content-Type-Options "nosniff"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/seattlefallbeers-error.log
    CustomLog ${APACHE_LOG_DIR}/seattlefallbeers-access.log combined
</VirtualHost>
