# Apache virtual host for one Freshies site. SITEDOMAIN stands for the site's
# domain (seattlefreshies.com, portlandfreshies.com, ...).
# Install: sed 's/SITEDOMAIN/seattlefreshies.com/g' freshies-site.conf \
#              | sudo tee /etc/apache2/sites-available/seattlefreshies.com.conf
#          sudo a2enmod headers && sudo a2ensite seattlefreshies.com
# certbot --apache later adds the HTTPS (:443) host and the HTTP redirect.
# (seattlefreshies.com was installed before this file was shared, and its
# live logs are named seattlefreshies-*.log, without the ".com".)
<VirtualHost *:80>
    ServerName SITEDOMAIN
    ServerAlias www.SITEDOMAIN
    DocumentRoot /var/www/SITEDOMAIN

    <Directory /var/www/SITEDOMAIN>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Hide dotfiles, including the scraper's short-lived .atg-staging-*
    # directories, but keep certbot's /.well-known/ reachable.
    <LocationMatch "^/\.(?!well-known/)">
        Require all denied
    </LocationMatch>

    # The home page is whichever seasonal list is in season. Temporary (302)
    # on purpose: the target changes a few times a year, and each list keeps
    # its own URL and search ranking year-round.
    #
    # To change the home page when the season changes:
    #   1. Change the page name at the end of the RedirectMatch line below
    #      (fresh-hops.html, festbier.html, pumpkin.html, ...) in BOTH live
    #      files on the droplet, for every site:
    #        /etc/apache2/sites-available/SITEDOMAIN.conf
    #        /etc/apache2/sites-available/SITEDOMAIN-le-ssl.conf
    #      The le-ssl (:443) copy is the one visitors hit; the :80 host only
    #      redirects to HTTPS.
    #   2. sudo apachectl configtest && sudo systemctl reload apache2
    #   3. curl -sI https://SITEDOMAIN/ | grep -i "^HTTP\|^location"
    #      should show 302 and the new page.
    #   4. In the repo, make the same change in
    #      deploy/digitalocean/freshies-site.conf and in
    #      public_templates/fresh-hop/index.html (the same redirect for local
    #      previews; both its refresh and canonical lines), then commit.
    #
    # Keep it a 302, never a 301: browsers and search engines remember a 301
    # and would keep sending people to last season's list. Leave the
    # out-of-season pages and their tabs in place, and never put a year in a
    # page name.
    RedirectMatch 302 "^/(index\.html)?$" "/fresh-hops.html"

    AddDefaultCharset UTF-8
    AddType text/calendar .ics
    AddType application/json .json

    <IfModule mod_headers.c>
        # data.json and events.ics change hourly; keep caches short.
        <FilesMatch "\.(json|ics)$">
            Header set Cache-Control "public, max-age=300"
        </FilesMatch>
        # Pages, script, styles, and images change only on code updates.
        <FilesMatch "\.(html|js|css|png|svg|ico)$">
            Header set Cache-Control "public, max-age=3600"
        </FilesMatch>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        # HTTPS only (browsers ignore it over HTTP anyway), so this block can
        # be identical in the :80 host and certbot's :443 copy. No
        # includeSubDomains: only this name and www are known to serve HTTPS.
        Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/SITEDOMAIN-error.log
    CustomLog ${APACHE_LOG_DIR}/SITEDOMAIN-access.log combined
</VirtualHost>
