<!DOCTYPE html>
<!-- Source for each Freshies site's og-image.png (1200x630), written to
     public_templates/_overlays/<site key>/. render.py next to this file fills
     in the site name and domain and shrinks the name if it would wrap. -->
<html><head><meta charset="UTF-8"><style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    background: #faf6ef; color: #2b2118;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px; border-bottom: 24px solid #4f7a28;
  }
  .icons { font-size: 88px; letter-spacing: 16px; }
  h1 { font-size: 112px; margin: 12px 0 20px; letter-spacing: -2px; white-space: nowrap; }
  p { font-size: 44px; margin: 0; color: #7a6a5a; line-height: 1.3; }
  .url { margin-top: 44px; font-size: 36px; color: #b4531c; font-weight: 600; }
</style></head><body>
  <div class="icons">🌿🥨🎃🍺</div>
  <h1>{{site_name}}</h1>
  <p>Fresh hop beers, festbiers, and other<br>seasonal beers.</p>
  <div class="url">{{domain}}</div>
</body></html>
